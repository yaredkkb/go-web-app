This error confirms that there are no .go files at the root level of your repository folder (/home/runner/work/go-web-app/go-web-app).
Because your Go code lives inside a subfolder, both your go build command and your golangci-lint step are looking in the wrong directory.
To fix this, you must explicitly tell GitHub Actions to execute your commands inside the specific folder where your code lives.
The Fix: Update Your Workflow YAML
Modify your GitHub Actions file to use the working-directory keyword for the build step, and the working-directory argument for the lint step:
yaml
steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Set up Go Runtime
    uses: actions/setup-go@v5
    with:
      # Points setup-go to the go.mod inside your subfolder
      go-version-file: go-web-app/go.mod 

  - name: Run golangci-lint
    uses: golangci/golangci-lint-action@v6
    with:
      version: v1.64.1
      # Points the linter to your subfolder
      working-directory: go-web-app 

  - name: Build Go Binary
    # Points the bash shell to execute inside your subfolder
    working-directory: go-web-app 
    run: go build -v -o go-web-app
Use code with caution.
Why this happens
go build error: Running go build without specifying files or a package target tells Go to compile the current directory. Since the root directory only contains configuration files (like your .git folder or workflow files), it fails with no Go files.
go-version-file path: The actions/setup-go step also needs the correct relative path to read your Go version safely from your module file.
