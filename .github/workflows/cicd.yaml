name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      # Builds using the root source file name verified in local directory map.
      - run: go build -v -o go-web-app main.go
      
      - run: go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pulls the absolute newest release automatically to support newer target go definitions
          version: latest

  push:
    needs: [build, code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Pre-flight verification block to check that repository secrets are accessible by the job runner
      - name: Check Secret Availability
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME repository secret is unassigned or empty!"
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}

  update-newtag-in-helm-chart:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Update tag in Helm chart
        run: |
          sed -i 's#tag: .*#tag: "${{ github.run_id }}"#' helm/go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "yaredkb"
          git config --global user.email "yaredk@sbcglobal.net"
          git add helm/go-web-app-chart/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update tag in Helm chart [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
